[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fluttery"
version = "1.0.0"
description = "Audio measurement and turntable calibration for the desktop"
requires-python = ">=3.12"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
readme = "README.md"
dependencies = [
    "numpy>=2.1,<3",
    "scipy>=1.16.3,<1.19",
    "sounddevice>=0.5.3,<0.6",
    "pillow>=11,<14",
    "wxPython>=4.3.2,<4.4",
    "matplotlib>=3.10,<3.12",
    "reportlab>=4,<5",
    "packaging>=24,<27",
    "certifi>=2025.1.31",
    "platformdirs>=4,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
build = ["pyinstaller>=6.16,<7"]

[project.gui-scripts]
fluttery = "fluttery.app:main"

[project.urls]
Repository = "https://github.com/ashleycox/Fluttery"

[tool.setuptools.packages.find]
include = ["fluttery*"]

[tool.setuptools.package-data]
fluttery = ["assets/*", "manual/*.md", "manual/images/*/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 105
